name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only on purpose: this workflow needs no secrets and never deploys.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, not tag, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check images against allowlist
        run: bash tools/ci/check_images.sh
      - name: Mock server tests
        run: python3 -m unittest discover -s tools/mock_server
      - name: Setup code signing tests
        run: python3 -m unittest discover -s tools/setup_codes
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 platform-tools"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists a PR's commits through the API. Read-only, and comments are off so it never needs write.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Personal-account repo: no GITLEAKS_LICENSE needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
