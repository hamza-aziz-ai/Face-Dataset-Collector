name: CI

# Docs-only changes skip the Android build, to save the shared Actions minutes. The secret scan in secrets.yml still runs on them.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

# A newer push to the same PR stops the older run. Runs on main always finish, because notify-cctv follows them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only on purpose: this workflow never deploys. Its only secret is the token in notify-cctv.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, not tag, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check images against allowlist
        run: bash tools/ci/check_images.sh
      - name: Mock server tests
        run: python3 -m unittest discover -s tools/mock_server
      - name: Setup code signing tests
        run: python3 -m unittest discover -s tools/setup_codes
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 platform-tools"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

  # After main passes, asks CCTV to move its submodule pin to this commit (owner's rule, CCTV PR #95). A daily CCTV run catches anything missed, including [skip ci] pushes.
  notify-cctv:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own fine-grained token does the work, so GITHUB_TOKEN gets nothing.
    permissions: {}
    steps:
      - name: Dispatch submodule-main to CCTV
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          # Skips quietly until the owner saves SUBMODULES_TOKEN in this repo, so CI stays green.
          if [ -z "$GH_TOKEN" ]; then echo "SUBMODULES_TOKEN not set, skipping."; exit 0; fi
          # A refused dispatch only warns: CCTV's daily run is the fallback, so a bad token must not turn main red.
          gh api repos/hamza-aziz-ai/CCTV-Face-Recognition-Attendance-System/dispatches -f event_type=submodule-main || echo "::warning::CCTV dispatch failed. Check that SUBMODULES_TOKEN has Contents read and write on CCTV. CCTV's daily run catches up."
